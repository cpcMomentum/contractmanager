name: node

# Frontend-Gate: ESLint + Typecheck + vitest + Produktions-Build muessen gruen
# sein, bevor gemergt wird. Laeuft auf ALLEN PRs (kein paths-Filter): als
# Required-Status-Check muss der Workflow immer melden, sonst blockiert ein
# nie-startender Check den Merge.

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie: der Bundle-Check diffst gegen den Ziel-Branch und
          # braucht die Merge-Base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhaengigkeiten installieren
        # npm/cli#4828: ein auf anderem OS erzeugter Lock laesst das plattform-
        # spezifische rollup-Binary fehlen. Lock entfernen erzwingt frische,
        # plattform-korrekte Aufloesung auf dem Linux-Runner.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      # Faengt Strings ab, die in t() stehen, aber in keiner l10n-Datei (#334).
      # Solche Texte fallen in JEDER Sprache auf den deutschen Quelltext zurueck
      # und bleiben beim Entwickeln unsichtbar, weil auf Deutsch getestet wird.
      # Der Pflichtschritt "bei l10n-Aenderung Sprache umschalten" konnte das
      # nicht auffangen: Wer den Eintrag vergisst, aendert keine l10n-Datei, also
      # greift der Ausloeser nicht.
      #
      # Seit #340 der Waechter aus worktime: er sieht zusaetzlich lib/,
      # templates/ und appinfo/. Der Vorgaenger prueft nur src/ und meldete
      # deshalb gruen, waehrend 29 Backend-Strings englisch ausgeliefert wurden.
      # Faengt vergessene Frontend-Builds. Kein Byte-Diff — der Build ist in der
      # CI nicht reproduzierbar (#251). Stattdessen: wurden Eingaben geaendert,
      # ohne dass sich js/ und css/ geaendert haben? Genau so blieb bei #327 die
      # verwundbare dompurify-Version im ausgelieferten Bundle stehen.
      - name: Bundle aktuell
        if: github.event_name == 'pull_request'
        run: npx --no-install nc-bundle-check "origin/${{ github.base_ref }}"

      - name: l10n-Vollstaendigkeit
        run: npm run l10n:check

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend-Unit-Tests (vitest)
        run: npm test

      - name: Produktions-Build
        run: npm run build

      # Ein Build-Artefakt-Drift-Check (git diff js/ css/) ist hier bewusst NICHT
      # aktiv: Er braucht einen reproduzierbaren Build, aber dieser Job wirft den
      # Lock weg (rm -f package-lock.json, npm/cli#4828) und floatet damit die
      # Dependency-Versionen -> Byte-Diff schlaegt immer an. Als Hard-Gate erst
      # sinnvoll nach Umstieg auf reproduzierbare Installs. Siehe #251.
      # Die eigentliche Absicherung gegen fehlende Build-Artefakte ist der
      # Packaging-Guard (Check 15) im Release-Skill.
