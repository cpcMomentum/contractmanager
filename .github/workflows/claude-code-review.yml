name: Claude Code Review

# Automatisches Review jedes PRs. Die Logik liegt in nc-app-tooling, damit sie
# nicht fuenfmal auseinanderlaeuft (#339) — hier stehen nur Ausloeser,
# Concurrency und die Weitergabe des Tokens.
#
# secrets: inherit ist PFLICHT. Ohne das ist CLAUDE_CODE_OAUTH_TOKEN im
# aufgerufenen Workflow leer und der Lauf scheitert.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    uses: cpcMomentum/nc-app-tooling/.github/workflows/claude-code-review.yml@v1.6.0
    secrets: inherit
